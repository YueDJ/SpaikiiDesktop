<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#101522"/>
      <stop offset="100%" style="stop-color:#1a2333"/>
    </linearGradient>
    <linearGradient id="foxBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB84D"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
    <linearGradient id="tailBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE566"/>
      <stop offset="100%" style="stop-color:#FFB800"/>
    </linearGradient>
    <filter id="glowG">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyG">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgG)" rx="24"/>

  <!-- ground shadow -->
  <ellipse cx="248" cy="340" rx="110" ry="14" fill="#000000" opacity="0.35"/>

  <!-- lightning tail (behind body) -->
  <g filter="url(#glowG)">
    <polygon points="300,300 352,262 336,256 380,196 356,240 372,236 322,296 344,288 306,322"
             fill="url(#tailBolt)"/>
    <polygon points="380,196 392,178 384,200 396,196 384,214" fill="#FFFFFF"/>
  </g>

  <!-- body -->
  <ellipse cx="248" cy="290" rx="72" ry="52" fill="url(#foxBody)"/>
  <!-- chest -->
  <ellipse cx="248" cy="306" rx="34" ry="26" fill="#FFF3E0"/>
  <!-- front legs -->
  <rect x="222" y="308" width="18" height="34" rx="9" fill="url(#foxBody)"/>
  <rect x="256" y="308" width="18" height="34" rx="9" fill="url(#foxBody)"/>
  <ellipse cx="231" cy="344" rx="13" ry="7" fill="#FFF3E0"/>
  <ellipse cx="265" cy="344" rx="13" ry="7" fill="#FFF3E0"/>

  <!-- head -->
  <circle cx="248" cy="196" r="56" fill="url(#foxBody)"/>

  <!-- ears -->
  <polygon points="206,168 192,106 240,142" fill="url(#foxBody)"/>
  <polygon points="290,168 304,106 256,142" fill="url(#foxBody)"/>
  <polygon points="210,156 202,122 230,142" fill="#FFF3E0"/>
  <polygon points="286,156 294,122 266,142" fill="#FFF3E0"/>

  <!-- forehead spark mark -->
  <polygon points="248,150 243,166 249,163 244,180 255,162 249,165 253,150" fill="#FFE566" filter="url(#tinyG)"/>

  <!-- muzzle -->
  <ellipse cx="248" cy="216" rx="24" ry="17" fill="#FFF3E0"/>
  <!-- nose -->
  <path d="M 241 208 L 255 208 L 248 218 Z" fill="#3d3d55"/>
  <!-- mouth -->
  <path d="M 248 218 Q 240 226 232 221 M 248 218 Q 256 226 264 221" stroke="#3d3d55" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- closed happy eyes -->
  <path d="M 214 192 Q 224 183 234 192" stroke="#3d3d55" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 262 192 Q 272 183 282 192" stroke="#3d3d55" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="214" cy="210" rx="9" ry="5" fill="#FF9EBB" opacity="0.5"/>
  <ellipse cx="282" cy="210" rx="9" ry="5" fill="#FF9EBB" opacity="0.5"/>

  <!-- sparkles -->
  <g fill="#FFE566" filter="url(#tinyG)">
    <circle cx="160" cy="120" r="3" opacity="0.8"/>
    <circle cx="360" cy="110" r="2.5" opacity="0.7"/>
    <circle cx="140" cy="220" r="2" opacity="0.6"/>
    <circle cx="150" cy="300" r="2" opacity="0.5"/>
    <circle cx="380" cy="300" r="2" opacity="0.5"/>
  </g>

  <!-- text -->
  <text x="256" y="424" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="8" fill="#FFB84D" filter="url(#tinyG)">SPARKII</text>
  <text x="256" y="460" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="8" fill="#7EA8D8" opacity="0.85">THE VOLT FOX</text>
</svg>
