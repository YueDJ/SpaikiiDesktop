<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0a0a0a" rx="24"/>

  <!-- Geometric diamond/rhombus frame -->
  <g transform="translate(256,195)" filter="url(#glow)">
    <polygon points="0,-105 105,0 0,105 -105,0" fill="none" stroke="url(#blueGrad)" stroke-width="2.5" opacity="0.5"/>
    <polygon points="0,-76 76,0 0,76 -76,0" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.3"/>

    <!-- Stylized S inside diamond -->
    <path d="M -28,-40 C -28,-40 -40,-18 -28,0 C -16,18 28,12 28,30 C 28,48 6,52 -12,40 C -28,30 -12,12 0,0 C 12,-12 -18,-18 -28,-40 Z"
          fill="url(#accentGrad)" opacity="0.9"/>

    <!-- Lightning bolt accent -->
    <polygon points="6,-58 -6,-18 6,-24 -6,24 12,-12 0,-6 12,-58" fill="url(#accentGrad)" opacity="0.7"/>

    <!-- Corner dots -->
    <circle cx="0" cy="-105" r="5" fill="#6366F1"/>
    <circle cx="105" cy="0" r="5" fill="#6366F1"/>
    <circle cx="0" cy="105" r="5" fill="#6366F1"/>
    <circle cx="-105" cy="0" r="5" fill="#6366F1"/>

    <!-- Mid-edge dots -->
    <circle cx="52" cy="-52" r="3" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="52" cy="52" r="3" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="-52" cy="52" r="3" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="-52" cy="-52" r="3" fill="#8B5CF6" opacity="0.6"/>
  </g>

  <!-- Decorative horizontal lines -->
  <g stroke="url(#blueGrad)" stroke-width="1" opacity="0.2">
    <line x1="80" y1="340" x2="190" y2="340"/>
    <line x1="322" y1="340" x2="432" y2="340"/>
  </g>

  <!-- Text: SPARKII -->
  <text x="256" y="390" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="200" letter-spacing="18" fill="#E2E8F0">SPARKII</text>

  <!-- Accent dot over i -->
  <circle cx="327" cy="345" r="5" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Subtext -->
  <text x="256" y="430" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="10" fill="#8B5CF6" opacity="0.7">INTELLIGENT AGENT</text>

  <!-- Bottom accent -->
  <line x1="205" y1="448" x2="307" y2="448" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
</svg>
