<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#FF0080"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgGrad)" rx="24"/>

  <!-- Background circuit pattern -->
  <g stroke="#7C3AED" stroke-width="1" fill="none" opacity="0.15">
    <path d="M 80 80 L 80 120 L 120 120"/>
    <path d="M 432 80 L 432 120 L 392 120"/>
    <path d="M 80 432 L 80 392 L 120 392"/>
    <path d="M 432 432 L 432 392 L 392 392"/>
    <circle cx="120" cy="120" r="3" fill="#7C3AED" opacity="0.3"/>
    <circle cx="392" cy="120" r="3" fill="#7C3AED" opacity="0.3"/>
    <circle cx="120" cy="392" r="3" fill="#7C3AED" opacity="0.3"/>
    <circle cx="392" cy="392" r="3" fill="#7C3AED" opacity="0.3"/>
  </g>

  <!-- Spark Bot Character -->
  <g transform="translate(256, 220)">
    <!-- Antenna with spark -->
    <line x1="0" y1="-95" x2="0" y2="-70" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-100" r="8" fill="url(#antennaGrad)" filter="url(#glow)"/>
    <!-- Antenna spark particles -->
    <circle cx="-12" cy="-108" r="2.5" fill="#FF6B6B" opacity="0.7"/>
    <circle cx="12" cy="-112" r="2" fill="#FF0080" opacity="0.6"/>
    <circle cx="0" cy="-115" r="2" fill="#FFD700" opacity="0.8"/>
    <circle cx="-8" cy="-118" r="1.5" fill="#FF6B6B" opacity="0.5"/>
    <circle cx="10" cy="-105" r="1.5" fill="#FFD700" opacity="0.6"/>

    <!-- Robot head - rounded square -->
    <rect x="-55" y="-70" width="110" height="90" rx="20" fill="url(#botGrad)" filter="url(#glow)"/>
    <!-- Head shine -->
    <ellipse cx="-20" cy="-50" rx="25" ry="18" fill="#FFEE88" opacity="0.4"/>
    
    <!-- Eyes - big friendly -->
    <ellipse cx="-22" cy="-35" rx="12" ry="14" fill="#0f0f23"/>
    <ellipse cx="22" cy="-35" rx="12" ry="14" fill="#0f0f23"/>
    <!-- Eye highlights -->
    <circle cx="-18" cy="-40" r="4" fill="white" opacity="0.9"/>
    <circle cx="26" cy="-40" r="4" fill="white" opacity="0.9"/>
    <circle cx="-24" cy="-30" r="2" fill="white" opacity="0.5"/>
    <circle cx="20" cy="-30" r="2" fill="white" opacity="0.5"/>

    <!-- Blush -->
    <ellipse cx="-35" cy="-18" rx="8" ry="5" fill="#FF6B6B" opacity="0.4"/>
    <ellipse cx="35" cy="-18" rx="8" ry="5" fill="#FF6B6B" opacity="0.4"/>

    <!-- Mouth - happy -->
    <path d="M -15 -15 Q 0 -5 15 -15" stroke="#0f0f23" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Body -->
    <rect x="-40" y="25" width="80" height="55" rx="12" fill="url(#botGrad)" filter="url(#glow)"/>
    <!-- Chest light -->
    <circle cx="0" cy="45" r="10" fill="#0f0f23"/>
    <circle cx="0" cy="45" r="6" fill="#00D4FF" filter="url(#softGlow)"/>
    <circle cx="0" cy="45" r="3" fill="#88EEFF"/>

    <!-- Arms -->
    <rect x="-70" y="30" width="25" height="15" rx="7" fill="url(#botGrad)"/>
    <rect x="45" y="30" width="25" height="15" rx="7" fill="url(#botGrad)"/>
    <!-- Hands -->
    <circle cx="-72" cy="38" r="8" fill="#FFD700"/>
    <circle cx="72" cy="38" r="8" fill="#FFD700"/>

    <!-- Legs -->
    <rect x="-25" y="80" width="18" height="25" rx="6" fill="url(#botGrad)"/>
    <rect x="7" y="80" width="18" height="25" rx="6" fill="url(#botGrad)"/>
    <!-- Feet -->
    <ellipse cx="-16" cy="108" rx="14" ry="8" fill="#FFA500"/>
    <ellipse cx="16" cy="108" rx="14" ry="8" fill="#FFA500"/>
  </g>

  <!-- Floating sparkles around bot -->
  <g fill="#FFD700" filter="url(#softGlow)">
    <circle cx="170" cy="140" r="3" opacity="0.8"/>
    <circle cx="340" cy="130" r="2.5" opacity="0.7"/>
    <circle cx="155" cy="200" r="2" opacity="0.6"/>
    <circle cx="355" cy="210" r="2.5" opacity="0.7"/>
    <circle cx="180" cy="280" r="2" opacity="0.5"/>
    <circle cx="330" cy="290" r="2" opacity="0.5"/>
  </g>

  <!-- Text: SPARKII -->
  <text x="256" y="430" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="6" fill="#FFD700" filter="url(#softGlow)">SPARKII</text>

  <!-- Subtext -->
  <text x="256" y="465" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="8" fill="#7C3AED" opacity="0.8">AI AGENT</text>
</svg>
