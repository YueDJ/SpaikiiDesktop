<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; padding: 40px; background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.logo-container { text-align: center; }
</style>
</head>
<body>
<div class="logo-container">
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Geometric diamond/rhombus frame -->
  <g transform="translate(200,155)" filter="url(#glow)">
    <!-- Outer diamond -->
    <polygon points="0,-90 90,0 0,90 -90,0" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.5"/>
    <!-- Inner diamond -->
    <polygon points="0,-65 65,0 0,65 -65,0" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.3"/>
    
    <!-- Stylized S inside diamond -->
    <path d="M -25,-35 C -25,-35 -35,-15 -25,0 C -15,15 25,10 25,25 C 25,40 5,45 -10,35 C -25,25 -10,10 0,0 C 10,-10 -15,-15 -25,-35 Z" 
          fill="url(#accentGrad)" opacity="0.9"/>
    
    <!-- Lightning bolt accent -->
    <polygon points="5,-50 -5,-15 5,-20 -5,20 10,-10 0,-5 10,-50" fill="url(#accentGrad)" opacity="0.7"/>
    
    <!-- Corner dots -->
    <circle cx="0" cy="-90" r="4" fill="#6366F1"/>
    <circle cx="90" cy="0" r="4" fill="#6366F1"/>
    <circle cx="0" cy="90" r="4" fill="#6366F1"/>
    <circle cx="-90" cy="0" r="4" fill="#6366F1"/>
    
    <!-- Mid-edge dots -->
    <circle cx="45" cy="-45" r="2.5" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="45" cy="45" r="2.5" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="-45" cy="45" r="2.5" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="-45" cy="-45" r="2.5" fill="#8B5CF6" opacity="0.6"/>
  </g>
  
  <!-- Decorative horizontal lines -->
  <g stroke="url(#blueGrad)" stroke-width="1" opacity="0.2">
    <line x1="60" y1="270" x2="150" y2="270"/>
    <line x1="250" y1="270" x2="340" y2="270"/>
  </g>
  
  <!-- Text: SPARKII -->
  <text x="200" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="50" font-weight="200" letter-spacing="16" fill="#E2E8F0">SPARKII</text>
  
  <!-- Accent dot over i -->
  <circle cx="262" cy="272" r="4" fill="url(#accentGrad)" filter="url(#glow)"/>
  
  <!-- Subtext -->
  <text x="200" y="345" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="8" fill="#8B5CF6" opacity="0.7">INTELLIGENT AGENT</text>
  
  <!-- Bottom accent -->
  <line x1="160" y1="360" x2="240" y2="360" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
</svg>
</div>
</body>
</html>
