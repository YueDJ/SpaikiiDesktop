<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgG1" cx="50%" cy="42%" r="75%">
      <stop offset="0%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#0c0a09"/>
    </radialGradient>
    <filter id="softG1">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgG1)" rx="24"/>

  <!-- halo ring -->
  <circle cx="256" cy="190" r="150" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.12"/>

  <!-- ===== Faceted fox head ===== -->
  <g filter="url(#softG1)">
    <!-- ears -->
    <polygon points="150,58 158,128 218,108" fill="#D97706"/>
    <polygon points="362,58 354,128 294,108" fill="#B45309"/>
    <!-- inner ears -->
    <polygon points="166,80 172,118 204,104" fill="#FFE8C7"/>
    <polygon points="346,80 340,118 308,104" fill="#F5D9B0"/>

    <!-- forehead -->
    <polygon points="218,108 256,96 256,190 205,175" fill="#FBBF24"/>
    <polygon points="294,108 256,96 256,190 307,175" fill="#F59E0B"/>

    <!-- upper cheeks -->
    <polygon points="158,128 218,108 205,175 166,205" fill="#F97316"/>
    <polygon points="354,128 294,108 307,175 346,205" fill="#EA580C"/>

    <!-- lower jaws -->
    <polygon points="166,205 205,175 256,190 256,240 208,262" fill="#FB923C"/>
    <polygon points="346,205 307,175 256,190 256,240 304,262" fill="#F4720B"/>

    <!-- muzzle -->
    <polygon points="208,262 256,240 256,296" fill="#FFF1DC"/>
    <polygon points="256,240 304,262 256,296" fill="#FFE3C2"/>

    <!-- nose -->
    <polygon points="243,282 269,282 256,298" fill="#1C1917"/>

    <!-- eyes: sharp amber slits -->
    <polygon points="204,182 240,188 212,200" fill="#FFD34D"/>
    <polygon points="308,182 272,188 300,200" fill="#FFD34D"/>
    <polygon points="216,186 228,188 218,195" fill="#1C1917"/>
    <polygon points="296,186 284,188 294,195" fill="#1C1917"/>
  </g>

  <!-- forehead spark mark -->
  <polygon points="258,112 248,142 257,138 248,168 266,136 257,140 264,112" fill="#FFF7D6" opacity="0.95"/>

  <!-- text -->
  <text x="256" y="408" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="300" letter-spacing="22" fill="#E7E5E4">SPARKII</text>
  <line x1="166" y1="428" x2="346" y2="428" stroke="#FFD700" stroke-width="1" opacity="0.35"/>
  <text x="256" y="456" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="10" fill="#D97706" opacity="0.9">AGENT</text>
</svg>
